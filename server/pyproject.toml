[project]
name = "streamstudio"
version = "0.1.0"
description = "StreamStudio — local-first AI-assisted YouTube editing studio (API + worker)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "num2words>=0.5.14,<0.6",
]

[project.optional-dependencies]
# offline media tools: lip-sync guard, avatar cut-out, object dissolve, opener renders
media = ["pillow>=10", "numpy>=1.26", "scipy>=1.11", "rembg>=2"]
# the episode factory: media plus the compositor's OpenCV and the site-capture browser.
# `media` stays a subset so `make setup-media` keeps working.
episode = [
    "pillow>=10",
    "numpy>=1.26",
    "scipy>=1.11",
    "rembg>=2",
    "opencv-python-headless>=4.9,<5",
    "playwright>=1.45",
]

[project.scripts]
streamstudio-api = "streamstudio.api.main:run"
streamstudio-worker = "streamstudio.worker.main:run"
streamstudio-schema = "streamstudio.edl.export:main"
streamstudio-mcp = "streamstudio.mcp:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.6",
    "pillow>=10",  # tests/test_lipsync.py
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/streamstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
per-file-ignores = { "src/streamstudio/avatar/cutout.py" = ["E501"] }  # ffmpeg argv lines
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008"]  # Depends() in defaults is the FastAPI idiom
